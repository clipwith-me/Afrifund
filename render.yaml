services:
  # Backend API Service
  - type: web
    name: afrifund-backend
    runtime: node
    env: node
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: afrifund-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: PORT
        value: 10000

databases:
  - name: afrifund-db
    databaseName: afrifund
    user: afrifund
    region: oregon
    plan: free
